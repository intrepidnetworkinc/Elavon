commerce_elavon.hosted_return:
  path: '/commerce-elavon/hosted-return'
  defaults:
    _controller: '\Drupal\commerce_elavon\Controller\HostedReturnController::returnFromConverge'
    _title: 'Payment'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

commerce_elavon.hosted_cancel:
  path: '/commerce-elavon/hosted-cancel'
  defaults:
    _controller: '\Drupal\commerce_elavon\Controller\HostedReturnController::cancelFromConverge'
    _title: 'Payment'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE